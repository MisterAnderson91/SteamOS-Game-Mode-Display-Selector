name: Build AppImage

# Trigger on push to main/master branches or manually via workflow_dispatch
on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'LICENSE'
      - 'README.md'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# Grants the workflow permission to create a Release
permissions:
  contents: write

jobs:
  build:
    # Using Ubuntu 22.04 ensures compatibility with older glibc versions (like SteamOS)
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set CalVer Version
      run: |
        # Generate date in YYYY.MM.DD format and save to GitHub environment
        CALVER=$(date +'%Y.%m.%d')
        echo "VERSION=$CALVER" >> $GITHUB_ENV
        echo "Building version: $CALVER"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        # file and fuse are required for appimagetool to function on Linux runners
        sudo apt-get install -y file fuse

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build executable with PyInstaller
      run: |
        pyinstaller DisplaySelector.spec

    - name: Prepare AppDir structure
      run: |
        # Ensure destination exists and copy the compiled binary
        mkdir -p DisplaySelector.AppDir/usr/bin
        cp -r dist/DisplaySelector/* DisplaySelector.AppDir/usr/bin/
        
        # Ensure AppRun is executable
        chmod +x DisplaySelector.AppDir/AppRun

        # Inject the dynamic version into the .desktop file
        sed -i "s/Version=.*/Version=${{ env.VERSION }}/g" DisplaySelector.AppDir/*.desktop

    - name: Download and execute appimagetool
      run: |
        # Download official appimagetool
        wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool-x86_64.AppImage
        
        # Build the AppImage and set the output filename using the environment variable
        VERSION=${{ env.VERSION }} ./appimagetool-x86_64.AppImage --appimage-extract-and-run DisplaySelector.AppDir SteamOS-Game-Mode-Display-Selector-${{ env.VERSION }}-x86_64.AppImage

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SteamOS-Display-Selector-${{ env.VERSION }}
        path: "SteamOS-Game-Mode-Display-Selector-${{ env.VERSION }}-x86_64.AppImage"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.VERSION }}
        name: SteamOS Game Mode Display Selector ${{ env.VERSION }}
        files: SteamOS-Game-Mode-Display-Selector-${{ env.VERSION }}-x86_64.AppImage
        draft: true
        prerelease: false
