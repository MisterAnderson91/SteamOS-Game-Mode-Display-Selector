name: Build AppImage

on:
  push:
    branches: [ "**" ] # Triggers on all branches
    paths-ignore:
      - 'LICENSE'
      - 'README.md'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set CalVer Version
      run: |
        CALVER=$(date +'%Y.%m.%d')
        echo "VERSION=$CALVER" >> $GITHUB_ENV
        echo "Building version: $CALVER"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y file fuse

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build executable with PyInstaller
      run: |
        pyinstaller DisplaySelector.spec

    - name: Prepare AppDir structure
      run: |
        mkdir -p DisplaySelector.AppDir/usr/bin
        cp -r dist/DisplaySelector/* DisplaySelector.AppDir/usr/bin/
        chmod +x DisplaySelector.AppDir/AppRun
        sed -i "s/Version=.*/Version=${{ env.VERSION }}/g" DisplaySelector.AppDir/*.desktop

    - name: Download and execute appimagetool
      run: |
        wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool-x86_64.AppImage
        VERSION=${{ env.VERSION }} ./appimagetool-x86_64.AppImage --appimage-extract-and-run DisplaySelector.AppDir SteamOS-Game-Mode-Display-Selector-${{ env.VERSION }}-x86_64.AppImage

    # 1. ALWAYS upload the artifact, regardless of branch. 
    # Appends the branch name so you know exactly what you are downloading.
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SteamOS-Display-Selector-${{ env.VERSION }}-${{ github.ref_name }}
        path: "SteamOS-Game-Mode-Display-Selector-${{ env.VERSION }}-x86_64.AppImage"

    # 2. ONLY run this step if the commit was pushed to the main or master branch.
    - name: Create GitHub Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.VERSION }}
        name: SteamOS Game Mode Display Selector ${{ env.VERSION }}
        files: SteamOS-Game-Mode-Display-Selector-${{ env.VERSION }}-x86_64.AppImage
        draft: false
        prerelease: false
